[package]
name = "oxscape_erode"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
exn = "0.3.0"
num-traits = "0.2.19"
ordered-float = { version = "5.1.0", optional = true }
oxscape_contour = {version = "0.1", path = "../oxscape_contour"}
oxscape_core = {version = "0.1", path = "../oxscape_core"}
rayon = "1.11"
wasm-bindgen = { version = "0.2.106", optional = true }

[features]
wasm_js = ["dep:wasm-bindgen"]
fill = ["dep:ordered-float"]
default = ["fill"]
