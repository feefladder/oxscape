[dependencies]
anyhow = "1.0.100"
bytemuck = "1.24.0"
num-traits = "0.2.19"
rand = "0.9.2"
rand_distr = "0.5.1"
rand_mt = "5.0.0"
rayon = "1.11.0"
ryu = "1.0.20"
