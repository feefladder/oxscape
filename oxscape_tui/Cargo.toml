[package]
name = "oxscape_tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage = "https://codeberg.org/feefladder/oxscape/"
repository = "https://codeberg.org/feefladder/oxscape/"
description = "Rust port of fastscape implicit stream-power law landscape evolution model"

[dependencies]
oxscape_core = {workspace = true}
oxscape_contour = {workspace = true}
oxscape_erode = {workspace = true}
oxscape_tile = {workspace = true}
rayon = {workspace = true}
rand = {workspace = true}
rand_chacha = {workspace = true}

color-eyre = "0.6.5"
colorous = "1.0.16"
crossterm = "0.29.0"
itertools = "0.14.0"

ratatui = {version="0.30.0"}


[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
