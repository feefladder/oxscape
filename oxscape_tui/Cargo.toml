[package]
name = "oxscape_tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage = "https://codeberg.org/feefladder/oxscape/"
repository = "https://codeberg.org/feefladder/oxscape/"
description = "Rust port of fastscape implicit stream-power law landscape evolution model"

[dependencies]
color-eyre = "0.6.5"
colorous = "1.0.16"
crossterm = "0.29.0"
itertools = "0.14.0"
oxscape_core = {version = "0.1", path = "../oxscape_core"}
oxscape_contour = {version = "0.1", path = "../oxscape_contour"}
oxscape_erode = {version = "0.1", path = "../oxscape_erode", default-features=false}
oxscape_tile = {version = "0.1", path= "../oxscape_tile"}
rand = "0.9.2"
ratatui = {version="0.30.0"}
rayon = "1.11.0"

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
