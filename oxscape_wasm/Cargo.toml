[package]
name = "oxscape_wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.83"
ordered-float = "5.1.0"
oxscape_core = {path = "../oxscape_core"}
oxscape_contour = {path = "../oxscape_contour"}
oxscape_erode = {path = "../oxscape_erode"}
rand = "0.9.2"
rayon = "1.11.0"
wasm-bindgen = "0.2.106"
wasm-bindgen-rayon = "1.3.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.56"
